name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Skipped while the repository is private, so it costs no paid minutes.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l pkg cmd)"
      - name: vet
        run: go vet -tags goolm ./...
      - name: test
        run: go test -race -tags goolm ./...
      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags goolm ./...
      - name: secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git .
