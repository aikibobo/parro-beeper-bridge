name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, platform: macos-apple-silicon, goos: darwin, goarch: arm64, cc: "clang -arch arm64" }
          - { runner: macos-latest, platform: macos-intel, goos: darwin, goarch: amd64, cc: "clang -arch x86_64" }
          - { runner: ubuntu-latest, platform: linux-amd64, goos: linux, goarch: amd64, cc: gcc }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, goos: linux, goarch: arm64, cc: gcc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -tags goolm -trimpath \
            -ldflags "-s -w -X main.Tag=${GITHUB_REF_NAME} -X main.Commit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "parro-beeper-bridge-${GITHUB_REF_NAME}-${{ matrix.platform }}" ./cmd/parro-beeper-bridge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: parro-beeper-bridge-${{ github.ref_name }}-${{ matrix.platform }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum parro-beeper-bridge-* > SHA256SUMS
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" parro-beeper-bridge-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --notes-file notes.md
